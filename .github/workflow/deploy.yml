name: Deploy React Portfolio to GitHub Pages

on:
  push:
    branches:
      - main  # deploy only on main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v6.2.0
        with:
          branch: gh-pages # branch to deploy to
          folder: build     # folder to deploy